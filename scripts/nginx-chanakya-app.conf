# Chanakya AI reverse proxy — Nginx vhost.
# Installed to /etc/nginx/sites-available/chanakya-app and symlinked into sites-enabled.
# Replace __SERVER_NAME__ with your domain or the bare VPS IP (installer does this).

server {
    listen 80;
    server_name __SERVER_NAME__;

    client_max_body_size 5m;

    location /ws {
        proxy_pass http://127.0.0.1:7060;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:7060;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
