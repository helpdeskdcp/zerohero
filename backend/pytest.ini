[pytest]
# Restrict collection to tests/ -- without this, pytest's default rootdir
# discovery also matches any repo-root script named test_*.py / *_test.py
# (e.g. a manual CLI harness like live_order_cli.py used to be named
# live_order_test.py), which gets IMPORTED at collection time -- running its
# module-level code, including a load_dotenv() call that leaked the real
# .env into the whole test session. See tests/conftest.py for the belt-and-
# braces env strip that also guards against this class of leak.
testpaths = tests
