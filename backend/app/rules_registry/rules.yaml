  - {re: "(_API_KEY|_API_SECRET|_SECRET|_TOTP_SECRET|_PASSWORD|_USERNAME|_CLIENT_ID|_APP_ID|_APP_SECRET|_ACCESS_TOKEN|_ANALYTICS_TOKEN|_API_TOKEN|_BOT_TOKEN|_REDIRECT_URI|_CHAT_ID|_CHANNEL_ID)$", category: SECRET_OR_ID}
