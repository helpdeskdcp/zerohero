# Added 2026-10-26 (ZeroHero Phase 12): `gzip on` alone compresses only text/html. Compress the text assets too (JS/CSS/JSON/SVG ...). Remove this file and reload nginx to roll back.
gzip_types application/javascript text/javascript text/css application/json image/svg+xml text/plain application/xml;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
